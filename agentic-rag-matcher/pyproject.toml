[project]
name = "agentic-rag-matcher"
version = "0.1.0"
description = "Single-agent agentic RAG pipeline for SFIA skill matching (CrewAI)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.15",
    "embedding-matcher",
    "keyword-matcher",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
match = "agentic_rag_matcher.match:main"

[tool.uv.sources]
embedding-matcher = { path = "../embedding-matcher", editable = true }
keyword-matcher = { path = "../keyword-matcher" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_rag_matcher"]
