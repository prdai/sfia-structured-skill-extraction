[project]
name = "embedding-matcher"
version = "0.1.0"
description = "Retrieve-and-rerank embedding search over the SFIA skill-level corpus"
requires-python = ">=3.12"
dependencies = [
    "qdrant-client>=1.12",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "tenacity>=9.0",
    "pydantic>=2.0",
]

[project.scripts]
ingest = "embedding_matcher.ingest:main"
search = "embedding_matcher.search:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
