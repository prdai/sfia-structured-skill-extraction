[project]
name = "sfia-evals"
version = "0.1.0"
description = "Shared SkillMatcher interface and evaluation harness for the SFIA matchers"
requires-python = ">=3.12"
dependencies = [
    "keyword-matcher",
    "embedding-matcher",
    "llm-matcher",
    "agentic-rag-matcher",
    "multi-agent-rag-matcher",
    "pydantic>=2.0",
]

[project.scripts]
eval-keyword = "sfia_evals.run_keyword:main"
eval-embedding = "sfia_evals.run_embedding:main"
eval-llm = "sfia_evals.run_llm:main"
eval-agentic-rag = "sfia_evals.run_agentic_rag:main"
eval-multi-agent-rag = "sfia_evals.run_multi_agent_rag:main"
sweep-llm-models = "sfia_evals.experiments.sweep_llm_models:main"
sweep-agentic-rag-models = "sfia_evals.experiments.sweep_agentic_rag_models:main"
sweep-multi-agent-rag-models = "sfia_evals.experiments.sweep_multi_agent_rag_models:main"
sweep-embedding = "sfia_evals.experiments.sweep_embedding:main"
eval-compare = "sfia_evals.compare:main"

[tool.uv.sources]
keyword-matcher = { path = "../keyword-matcher" }
embedding-matcher = { path = "../embedding-matcher", editable = true }
llm-matcher = { path = "../llm-matcher", editable = true }
agentic-rag-matcher = { path = "../agentic-rag-matcher", editable = true }
multi-agent-rag-matcher = { path = "../multi-agent-rag-matcher", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
