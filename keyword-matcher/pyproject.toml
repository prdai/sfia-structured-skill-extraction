[project]
name = "keyword-matcher"
version = "0.1.0"
description = "BM25 lexical baseline for SFIA skill matching"
requires-python = ">=3.12"
dependencies = [
    "rank-bm25>=0.2.2",
    "pydantic>=2.0",
    "nltk>=3.9",
]

[project.scripts]
match = "keyword_matcher.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
