[project]
name = "llm-matcher"
version = "0.1.0"
description = "Pure LLM SFIA skill matching via Workers AI, no retrieval"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tenacity>=9.0",
]

[project.scripts]
match = "llm_matcher.match:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
