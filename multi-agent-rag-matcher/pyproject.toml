[project]
name = "multi-agent-rag-matcher"
version = "0.1.0"
description = "Multi-agent (retriever/matcher/verifier) CrewAI pipeline for SFIA skill matching"
requires-python = ">=3.12,<3.14"
dependencies = [
    "crewai>=1.15",
    "embedding-matcher",
    "keyword-matcher",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
multi-agent-match = "multi_agent_rag_matcher.match:main"

[tool.uv.sources]
embedding-matcher = { path = "../embedding-matcher", editable = true }
keyword-matcher = { path = "../keyword-matcher" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_rag_matcher"]
